name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ci:
    uses: ImreBoersma/projects/.github/workflows/ci-node.yml@main
    with: { artifact: dist }
  deploy:
    needs: ci
    permissions: { pages: write, id-token: write }
    uses: ImreBoersma/projects/.github/workflows/deploy-pages.yml@main
