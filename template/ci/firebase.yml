name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ci:
    uses: ImreBoersma/projects/.github/workflows/ci-node.yml@main
    with: { artifact: dist }
  deploy:
    needs: ci
    uses: ImreBoersma/projects/.github/workflows/deploy-firebase.yml@main
    with: { project-id: "${{ vars.FIREBASE_PROJECT_ID }}" }
    secrets: { firebase-service-account: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
