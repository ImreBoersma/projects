# Shared deploy to Firebase Hosting. Contract: specs/002-shared-workflows/contracts/workflows.md
name: deploy-firebase

on:
  workflow_call:
    inputs:
      project-id:
        type: string
        required: true
      target:
        description: Hosting target in firebase.json. Empty when firebase.json has one site.
        type: string
        default: ""
    secrets:
      firebase-service-account:
        required: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check the secret
        env:
          SERVICE_ACCOUNT: ${{ secrets.firebase-service-account }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::The secret firebase-service-account is not set."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Find the public folder
        id: public
        env:
          TARGET: ${{ inputs.target }}
        run: |
          dir=$(jq -r --arg t "$TARGET" '
            [.hosting] | flatten | map(select($t == "" or .target == $t)) | .[0].public // empty
          ' firebase.json)
          if [ -z "$dir" ]; then
            echo "::error::firebase.json has no hosting entry for target \"$TARGET\"."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ${{ steps.public.outputs.dir }}
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.firebase-service-account }}
          projectId: ${{ inputs.project-id }}
          target: ${{ inputs.target }}
          channelId: live
