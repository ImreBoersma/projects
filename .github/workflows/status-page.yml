name: status-page

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.yaml
      - "status/**"
  # CI for PRs, for example Renovate updates of status/ (spec 003). Only job build runs.
  pull_request:
    paths:
      - projects.yaml
      - "status/**"

concurrency:
  group: status-page-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: status

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Spec 007: read the open status-problem issues for the problem links.
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run start --mode page
        env:
          STATUS_READ_TOKEN: ${{ secrets.STATUS_READ_TOKEN }}
          STATUS_READ_TOKEN_HOB: ${{ secrets.STATUS_READ_TOKEN_HOB }}
          CONFORMANCE_READ_TOKEN: ${{ secrets.CONFORMANCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  # Separate from deploy: an issue error does not stop the page deploy (research.md §8).
  issues:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The sync step must not run at the same time as board-sync.yml (spec 004).
    concurrency:
      group: board-sync
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run start --mode issues
        env:
          STATUS_READ_TOKEN: ${{ secrets.STATUS_READ_TOKEN }}
          STATUS_READ_TOKEN_HOB: ${{ secrets.STATUS_READ_TOKEN_HOB }}
          CONFORMANCE_READ_TOKEN: ${{ secrets.CONFORMANCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Adds the problem issues to the board. GITHUB_TOKEN events start no workflow (spec 004).
      - name: Sync the board
        run: bun run board:sync
        env:
          BOARD_URL: https://github.com/users/ImreBoersma/projects/4
          BOARD_SYNC_TOKEN: ${{ secrets.BOARD_SYNC_TOKEN }}
      # Spec 005: tell healthchecks.io that the hourly run passed. No ping in time gives an alert.
      # This step runs only when all steps before it passed. Without the secret it does nothing.
      - name: Ping the watchdog
        run: '[ -z "$STATUS_HEALTHCHECK_URL" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$STATUS_HEALTHCHECK_URL"'
        env:
          STATUS_HEALTHCHECK_URL: ${{ secrets.STATUS_HEALTHCHECK_URL }}
