name: status-page

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.yaml
      - "status/**"

concurrency:
  group: status-page
  cancel-in-progress: false

defaults:
  run:
    working-directory: status

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run start --mode page
        env:
          STATUS_READ_TOKEN: ${{ secrets.STATUS_READ_TOKEN }}
          STATUS_READ_TOKEN_HOB: ${{ secrets.STATUS_READ_TOKEN_HOB }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Separate from deploy: an issue error does not stop the page deploy (research.md §8).
  issues:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run start --mode issues
        env:
          STATUS_READ_TOKEN: ${{ secrets.STATUS_READ_TOKEN }}
          STATUS_READ_TOKEN_HOB: ${{ secrets.STATUS_READ_TOKEN_HOB }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
