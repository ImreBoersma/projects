name: status-page

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.yaml
      - "status/**"
      - "template/**"
  # CI for PRs, for example Renovate updates of status/ (spec 003). Only job build runs.
  pull_request:
    paths:
      - projects.yaml
      - "status/**"
      - "template/**"

concurrency:
  group: status-page-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: status

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Spec 007: read the open status-problem issues for the problem links.
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      # Spec 010: the stored results of the branch `data`. Without the branch (first run) the page
      # starts without history.
      - name: Get the stored results
        run: |
          # Spec 010 T025: a missing branch is normal at the start; a failed read is not.
          if ! heads=$(git ls-remote --heads origin data); then
            echo "::warning::History: the branch data could not be read. The page shows no history for this run."
            echo "HISTORY_NOT_READ=1" >> "$GITHUB_ENV"
          elif [ -z "$heads" ]; then
            echo "History: no branch data yet."
          elif git fetch --depth=1 origin data:refs/remotes/origin/data && git worktree add --detach ../_data origin/data; then
            echo "History: $(find ../_data/history -maxdepth 1 -type f 2>/dev/null | wc -l) day files."
          else
            echo "::warning::History: the branch data exists but could not be fetched. The page shows no history for this run."
            echo "HISTORY_NOT_READ=1" >> "$GITHUB_ENV"
          fi
      - run: bun run start --mode page --history ../_data/history --history-out ../_history/line.ndjson
        env:
          STATUS_READ_TOKEN: ${{ secrets.STATUS_READ_TOKEN }}
          STATUS_READ_TOKEN_HOB: ${{ secrets.STATUS_READ_TOKEN_HOB }}
          CONFORMANCE_READ_TOKEN: ${{ secrets.CONFORMANCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: _site
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: history
          path: _history
          if-no-files-found: error

  # Spec 010: append the result of this run to the branch `data`. Separate from deploy, so that a
  # failed push does not stop the page (FR-009). A push with GITHUB_TOKEN starts no workflow, and no
  # trigger of this workflow reacts to the branch `data`.
  history:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Outside the work tree: `git rm -rf .` and `git reset --hard` must not remove it.
      - uses: actions/download-artifact@v8
        with:
          name: history
          path: ${{ runner.temp }}/history
      - name: Append the result to the branch data
        run: |
          line="$RUNNER_TEMP/history/line.ndjson"
          [ -s "$line" ] || { echo "No result line."; exit 1; }
          time=$(head -c 200 "$line" | grep -o '"time":"[^"]*' | cut -d'"' -f4)
          day=${time%%T*}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify -q origin/data >/dev/null; then
            git checkout -q -B data origin/data
          else
            git checkout -q --orphan data
            git rm -rqf .
            {
              echo "# Status history"
              echo
              echo "This branch holds the results of the status page runs (spec 010 of this repo)."
              echo "Each file history/YYYY-MM-DD.ndjson has one line for each run. Do not merge this branch."
            } > README.md
          fi
          append() {
            mkdir -p history
            cat "$line" >> "history/$day.ndjson"
            git add README.md "history/$day.ndjson" 2>/dev/null || git add "history/$day.ndjson"
            git commit -q -m "chore: add the status result of $time"
          }
          append
          if ! git push -q origin data; then
            echo "The push failed. Get the branch again and try one more time."
            git fetch -q origin data
            git reset -q --hard origin/data
            append
            git push -q origin data
          fi

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  # Separate from deploy: an issue error does not stop the page deploy (research.md §8).
  issues:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The sync step must not run at the same time as board-sync.yml (spec 004).
    concurrency:
      group: board-sync
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run start --mode issues
        env:
          STATUS_READ_TOKEN: ${{ secrets.STATUS_READ_TOKEN }}
          STATUS_READ_TOKEN_HOB: ${{ secrets.STATUS_READ_TOKEN_HOB }}
          CONFORMANCE_READ_TOKEN: ${{ secrets.CONFORMANCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Adds the problem issues to the board. GITHUB_TOKEN events start no workflow (spec 004).
      - name: Sync the board
        run: bun run board:sync
        env:
          BOARD_URL: https://github.com/users/ImreBoersma/projects/4
          BOARD_SYNC_TOKEN: ${{ secrets.BOARD_SYNC_TOKEN }}
      # Spec 005: tell healthchecks.io that the hourly run passed. No ping in time gives an alert.
      # This step runs only when all steps before it passed. Without the secret it does nothing.
      - name: Ping the watchdog
        run: '[ -z "$STATUS_HEALTHCHECK_URL" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$STATUS_HEALTHCHECK_URL"'
        env:
          STATUS_HEALTHCHECK_URL: ${{ secrets.STATUS_HEALTHCHECK_URL }}
