# Shared deploy to Vercel. Contract: specs/002-shared-workflows/contracts/workflows.md
# The caller repo needs the Actions variables VERCEL_ORG_ID and VERCEL_PROJECT_ID.
name: deploy-vercel

on:
  workflow_call:
    secrets:
      vercel-token:
        required: true

env:
  VERCEL_CLI: vercel@65.8.0

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.vercel-token }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the secret and the variables
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # `vercel build` runs the install command of the project.
      - if: hashFiles('bun.lock') != ''
        uses: oven-sh/setup-bun@v2
      - name: Get the Vercel settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
