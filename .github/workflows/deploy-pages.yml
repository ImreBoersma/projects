# Shared deploy to GitHub Pages. Contract: specs/002-shared-workflows/contracts/workflows.md
# The caller job must give `pages: write` and `id-token: write`.
name: deploy-pages

on:
  workflow_call:

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # GitHub Pages deploys only to this environment (constitution, Development Workflow).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Sometimes the API does not list the Pages artifact of this job yet, and deploy-pages stops
      # with "No artifacts named github-pages were found" (3 times on 2026-11-24). Try once more.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
