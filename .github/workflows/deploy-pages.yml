# Shared deploy to GitHub Pages. Contract: specs/002-shared-workflows/contracts/workflows.md
# The caller job must give `pages: write` and `id-token: write`.
name: deploy-pages

on:
  workflow_call:

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # GitHub Pages deploys only to this environment (constitution, Development Workflow).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
