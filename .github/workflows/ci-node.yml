# Shared CI for Node projects. Contract: specs/002-shared-workflows/contracts/workflows.md
name: ci-node

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      artifact:
        description: Folder to upload as artifact `build` after the build.
        type: string
        default: ""
      legacy-scan:
        description: Scan the repo for legacy web code (Modern Web Guidance) and write a job summary. Never fails the job.
        type: boolean
        default: false
    secrets:
      build-env:
        description: KEY=value lines. CI writes them to .env.local before the build.
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Find the package manager
        id: pm
        run: |
          if [ -f bun.lock ]; then pm=bun
          elif [ -f yarn.lock ]; then pm=yarn
          elif [ -f package-lock.json ]; then pm=npm
          else
            echo "::error::No lock file found. Add bun.lock, yarn.lock or package-lock.json."
            exit 1
          fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"

      - name: Enable corepack
        if: steps.pm.outputs.pm == 'yarn'
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.pm != 'bun' && steps.pm.outputs.pm || '' }}
      - if: steps.pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install the dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
          esac

      - name: Lint
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          case "$PM" in
            bun) bunx biome ci . ;;
            yarn) yarn biome ci . ;;
            npm) npx biome ci . ;;
          esac

      - name: Write the build environment
        env:
          BUILD_ENV: ${{ secrets.build-env }}
        run: |
          if [ -n "$BUILD_ENV" ]; then printf '%s\n' "$BUILD_ENV" > .env.local; fi

      - name: Build
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            echo "No build script. CI does not build."
            exit 0
          fi
          case "$PM" in
            bun) bun run build ;;
            yarn) yarn build ;;
            npm) npm run build ;;
          esac

      - name: Test
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "No test script. CI does not test."
            exit 0
          fi
          case "$PM" in
            bun) bun run test ;;
            yarn) yarn test ;;
            npm) npm test ;;
          esac

      # Spec 023 US4, contracts/ci-input.md: a report only; a finding or an error never fails CI.
      # A pinned version gives the same rules in each run; Renovate does not update it (a campaign does).
      - name: Scan for legacy web code
        if: inputs.legacy-scan
        continue-on-error: true
        timeout-minutes: 5
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          out="$RUNNER_TEMP/legacy.json"
          if ! npx -y modern-web-guidance@1.0.1 legacy-scan . --json > "$out" || ! summary=$(jq -r '
              [.guides[] | .guideId as $g | .rules[].findings[] | {file, line, g: $g, m: .message}] as $f
              | if ($f | length) == 0 then "### Legacy web code: no findings"
                else "### Legacy web code: \($f | length) findings\n\n| File | Line | Guide | Change |\n|---|---|---|---|\n"
                  + ($f | map("| \(.file) | \(.line) | \(.g) | \(.m | gsub("\\s*\n\\s*"; " ") | gsub("\\|"; "\\|")) |") | join("\n"))
                  + "\n\nThe scan checks about 20 % of the Modern Web Guidance catalogue."
                end' "$out"); then
            echo "### Legacy web code: scan not available" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

      - if: inputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: ${{ inputs.artifact }}
          if-no-files-found: error
