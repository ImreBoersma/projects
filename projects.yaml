# Spec 013: each secret that the projects and this repo use. Names, places and dates only.
# `expires`: a date; `never` when an expiry is possible but not set (the page warns); `none` when
# the value cannot expire (a host name, a URL, a key without an expiry setting).
secrets:
  # This repo (shared setup).
  - name: STATUS_READ_TOKEN
    kind: actions-secret
    where: ImreBoersma/projects
    expires: never
  - name: STATUS_READ_TOKEN_HOB
    kind: actions-secret
    where: ImreBoersma/projects
    expires: 2027-11-06
  # Fine-grained, owner CJW-Brummen, read only (same settings as STATUS_READ_TOKEN_HOB).
  - name: STATUS_READ_TOKEN_CJW
    kind: actions-secret
    where: ImreBoersma/projects
    expires: 2027-11-22
  - name: CONFORMANCE_READ_TOKEN
    kind: actions-secret
    where: ImreBoersma/projects
    expires: never
  - name: BOARD_TOKEN
    kind: actions-secret
    where: ImreBoersma/projects
    expires: 2027-11-24
  - name: BOARD_SYNC_TOKEN
    kind: actions-secret
    where: ImreBoersma/projects
    expires: 2027-11-06
  - name: STATUS_HEALTHCHECK_URL
    kind: actions-secret
    where: ImreBoersma/projects
    expires: none
  # Google API key, restricted to the PageSpeed Insights API, no expiry, in a project without billing (spec 023).
  - name: PSI_API_KEY
    kind: actions-secret
    where: ImreBoersma/projects
    expires: never
  # Fine-grained PAT, projects only, Actions read/write: starts status-page.yml each hour (spec 005 T025).
  - name: STATUS_PAGE_TRIGGER
